name: Validate and deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-production
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test -- --maxWorkers=1
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: pages-dist
          path: dist
          retention-days: 7
  deploy:
    if: vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: pages-dist
          path: dist
      - name: Deploy checked source to existing Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4.100.0 pages deploy dist --project-name=artemis-common-ground --branch=main --commit-hash="$GITHUB_SHA"
